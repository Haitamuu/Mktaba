<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mktaba</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root {
            --carpet-red: #8b1c21;
            --carpet-black: #110e0e;
            --carpet-dark: #181214;
            --shelf-brown: #5d4037;
            --shelf-dark: #37231c;
            --carpet-purple: #3e2a4f;
            --jasmine: #fdfdf0;
            --pomegranate: #d32f2f;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-muted: rgba(212, 175, 55, 0.45);
            --danger: #b02a2a;
            --statut-lu: #2e7d32;
            --statut-encours: #f57f17;
            --statut-paslu: #616161;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Angles nets et géométriques stricts */
        }

        body { 
            font-family: 'Lora', serif; 
            background-color: var(--carpet-black);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(62, 42, 79, 0.4) 0%, rgba(17, 14, 14, 0.88) 65%, rgba(10, 8, 8, 0.97) 100%),
                url('https://media.castorama.fr/is/image/Castorama/tapis-oriental-persan-rouge-l-230-x-l-160-cm-balta~5412776453068_01c_FR_CF?$MOB_PREV$&$width=2792&$height=2792');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: var(--jasmine); 
            min-height: 100vh;
            line-height: 1.6;
        }

        /* --- ÉCRAN DE CONNEXION --- */
        #login-screen {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(139, 28, 33, 0.45) 0%, rgba(17, 14, 14, 0.92) 70%, rgba(10, 8, 8, 0.98) 100%),
                url('https://media.castorama.fr/is/image/Castorama/tapis-oriental-persan-rouge-l-230-x-l-160-cm-balta~5412776453068_01c_FR_CF?$MOB_PREV$&$width=2792&$height=2792');
            background-size: cover; 
            background-position: center;
            display: flex; 
            justify-content: center; 
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .login-box {
            background: rgba(17, 14, 14, 0.96); 
            padding: 50px 40px; 
            border: 3px solid var(--gold);
            outline: 1px solid var(--gold-muted);
            outline-offset: -8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 25px rgba(212, 175, 55, 0.25); 
            text-align: center; 
            max-width: 420px; 
            width: 100%;
            position: relative;
        }

        .login-box h1 { 
            font-family: 'Cinzel Decorative', cursive; 
            font-size: 2.6rem; 
            margin: 0 0 30px 0; 
            color: var(--gold); 
            letter-spacing: 2px;
        }

        .login-box input { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 20px; 
            background: rgba(255,255,255,0.06); 
            border: 2px solid var(--gold); 
            color: var(--gold); 
            font-family: 'Cinzel', serif; 
            text-align: center; 
            font-size: 1.15rem; 
            outline: none;
            transition: all 0.3s;
        }

        .login-box input:focus { 
            background: rgba(212, 175, 55, 0.15); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .login-box button { 
            width: 100%; 
            padding: 16px; 
            background: var(--pomegranate); 
            color: white; 
            border: 2px solid var(--gold); 
            cursor: pointer; 
            font-family: 'Cinzel', serif; 
            font-size: 1.05rem; 
            font-weight: 700;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .login-box button:hover { 
            background: var(--danger); 
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.6);
            transform: translateY(-2px);
        }

        #login-error {
            color: #ff6b6b;
            font-family: 'Lora', serif;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        /* --- APPLICATION PRINCIPALE --- */
        #app-main { 
            padding: 50px 20px 80px; 
            max-width: 1400px;
            margin: 0 auto;
        }

        /* EN-TÊTE */
        .header-container {
            position: relative; 
            max-width: 850px; 
            margin: 0 auto 40px; 
            padding: 40px 30px;
            border: 3px solid var(--gold);
            outline: 1px solid var(--gold-muted);
            outline-offset: -8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.25); 
            text-align: center;
            background: 
                linear-gradient(rgba(17, 14, 14, 0.75), rgba(17, 14, 14, 0.85)),
                url('https://i.pinimg.com/736x/30/0d/23/300d235e6587f5185ff6d21115ff784b.jpg');
            background-size: cover; 
            background-position: center;
        }

        .header-container h1 { 
            font-family: 'Cinzel Decorative', cursive; 
            font-size: 3.8rem; 
            color: var(--gold);
            margin: 0; 
            text-shadow: 3px 3px 10px rgba(0,0,0,1), 0 0 20px rgba(212, 175, 55, 0.3); 
            background: rgba(17, 14, 14, 0.65);
            display: inline-block; 
            padding: 10px 40px; 
            border: 1px solid var(--gold-muted);
            letter-spacing: 4px;
        }

        /* STATISTIQUES COMPTEURS */
        .stats-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--gold-muted);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 85px;
        }

        .stat-num {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 700;
        }

        .stat-nom {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(253, 253, 240, 0.7);
        }

        /* --- CONSOLE DE GESTION --- */
        .container-gestion {
            max-width: 850px; 
            margin: 0 auto 50px; 
            background: rgba(17, 14, 14, 0.92);
            padding: 40px; 
            border: 2px solid var(--gold); 
            outline: 1px solid var(--gold-muted);
            outline-offset: -7px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(211, 47, 47, 0.3); 
            backdrop-filter: blur(4px);
        }

        /* CONTRÔLES SUPÉRIEURS */
        .controles-superieurs { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        .filtres-categorie, .controles-droite { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap;
        }
        
        .btn-filtre {
            background: rgba(93, 64, 55, 0.6); 
            color: var(--jasmine); 
            border: 1px solid var(--gold);
            padding: 9px 18px; 
            cursor: pointer; 
            font-family: 'Cinzel', serif; 
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.25s;
        }

        .btn-filtre:hover { 
            background: rgba(212, 175, 55, 0.25); 
            color: var(--gold-light);
        }

        .btn-filtre.active { 
            background: var(--gold); 
            color: var(--carpet-black); 
            font-weight: 700;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }
        
        #select-annee { 
            background: rgba(25, 18, 20, 0.9);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 9px 15px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        #select-annee option { 
            background: var(--carpet-black); 
            color: var(--gold); 
            padding: 8px;
        }

        .controles-vue {
            display: flex;
            gap: 5px;
        }

        /* RECHERCHE */
        .borne-recherche { 
            margin-bottom: 25px; 
            position: relative;
        }

        #input-recherche {
            width: 100%; 
            padding: 15px; 
            background: rgba(212, 175, 55, 0.08);
            border: 2px solid var(--gold); 
            color: var(--gold); 
            font-family: 'Lora', serif;
            font-size: 1.1rem; 
            outline: none;
            transition: all 0.3s;
        }

        #input-recherche::placeholder {
            color: rgba(212, 175, 55, 0.6);
            font-style: italic;
        }

        #input-recherche:focus { 
            background: rgba(212, 175, 55, 0.16); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* FORMULAIRE D'AJOUT */
        #formulaire-livre { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
        }

        #formulaire-livre input, .edit-form input { 
            padding: 13px 15px; 
            border: 1px solid var(--gold); 
            background: rgba(93, 64, 55, 0.45);
            color: var(--gold); 
            font-family: 'Lora', serif; 
            font-size: 1.05rem; 
            outline: none;
            transition: all 0.25s;
        }

        #formulaire-livre input::placeholder, .edit-form input::placeholder {
            color: rgba(212, 175, 55, 0.55);
        }

        #formulaire-livre input:focus, .edit-form input:focus {
            background: rgba(93, 64, 55, 0.7);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        #formulaire-livre button { 
            grid-column: span 2; 
            background: var(--pomegranate); 
            color: var(--jasmine); 
            border: 2px solid var(--gold); 
            padding: 15px; 
            cursor: pointer; 
            font-family: 'Cinzel', serif; 
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1.5px;
            transition: all 0.3s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #formulaire-livre button:hover { 
            background: var(--danger); 
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.6);
            transform: translateY(-2px);
        }

        /* ZONE D'ARCHIVES & IMPORT/EXPORT */
        .zone-archives {
            margin-top: 25px; 
            border-top: 1px solid var(--gold-muted); 
            padding-top: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }

        .zone-archives-btns {
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
        }

        .btn-archive {
            flex: 1;
            min-width: 220px;
            padding: 11px 15px;
            background: rgba(93, 64, 55, 0.5);
            color: var(--jasmine);
            border: 1px solid var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.25s;
            text-align: center;
        }

        .btn-archive:hover {
            background: rgba(212, 175, 55, 0.25);
            color: var(--gold-light);
        }

        /* --- ÉTAGÈRE : VUE GRILLE --- */
        #mon-etagere { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 35px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        .livre {
            background-color: var(--shelf-dark); 
            border: 2px solid rgba(212, 175, 55, 0.5);
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s ease;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.7), 0 0 1px rgba(212, 175, 55, 0.4); 
            position: relative;
        }

        .livre:hover { 
            transform: translateY(-6px); 
            border-color: var(--gold);
            box-shadow: 12px 14px 25px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.25); 
        }

        /* Reliure latérale effet livre */
        .livre::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(to right, rgba(0,0,0,0.7), rgba(212, 175, 55, 0.35) 50%, rgba(0,0,0,0.4));
            z-index: 10;
        }

        /* BADGE STATUT (ANGLES NETS) */
        .badge-statut {
            position: absolute; 
            top: 10px; 
            right: 10px; 
            padding: 5px 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff; 
            z-index: 15; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .badge-statut:hover { 
            transform: scale(1.08); 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* COUVERTURE DU LIVRE */
        .livre-cover-container {
            width: 100%;
            height: 330px;
            background: #000000;
            border-bottom: 2px solid var(--gold);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .livre img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.4s ease;
        }

        .livre:hover img {
            transform: scale(1.03);
        }

        /* INFOS LIVRE (PARCHEMIN NOBLE) */
        .livre-info {
            padding: 20px; 
            text-align: center; 
            flex-grow: 1; 
            background-color: var(--jasmine);
            background-image: 
                linear-gradient(rgba(253, 253, 240, 0.88), rgba(253, 253, 240, 0.88)), 
                url('https://i.pinimg.com/736x/a7/0f/c1/a70fc1763277a5640da70dddd6f05da0.jpg');
            background-size: cover; 
            color: var(--carpet-black);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .livre h2 { 
            font-family: 'Lora', serif; 
            font-size: 1.15rem; 
            font-weight: 700; 
            margin: 0 0 6px 0; 
            color: #1a0f11;
            line-height: 1.35;
        }

        .livre h3 { 
            font-size: 0.95rem; 
            font-style: italic; 
            color: var(--carpet-purple); 
            margin: 0 0 8px 0; 
        }

        .livre-annee { 
            font-size: 0.85rem; 
            color: var(--carpet-red); 
            font-weight: bold; 
            margin-top: 6px; 
            border-top: 1px solid rgba(139, 28, 33, 0.2);
            padding-top: 6px;
        }

        /* ACTIONS */
        .actions { 
            display: grid; 
            grid-template-columns: 1fr; 
            background: var(--carpet-black); 
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        .btn-action { 
            padding: 12px; 
            border: none; 
            cursor: pointer; 
            color: var(--gold); 
            background: transparent; 
            font-family: 'Cinzel', serif; 
            font-size: 0.85rem; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s; 
        }

        .bouton-modifier:hover { 
            background: rgba(212, 175, 55, 0.15); 
            color: var(--gold-light);
        }

        /* --- ÉTAGÈRE : VUE LISTE --- */
        #mon-etagere.mode-liste { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            max-width: 1050px; 
        }

        #mon-etagere.mode-liste .livre { 
            flex-direction: row; 
            height: 140px; 
        }

        #mon-etagere.mode-liste .livre:hover { 
            transform: translateX(6px); 
        }

        #mon-etagere.mode-liste .livre-cover-container { 
            width: 105px; 
            height: 100%; 
            border-bottom: none; 
            border-right: 2px solid var(--gold); 
            flex-shrink: 0;
        }

        #mon-etagere.mode-liste .livre-info { 
            text-align: left; 
            padding: 15px 25px; 
            justify-content: center; 
        }

        #mon-etagere.mode-liste .livre h2 { 
            font-size: 1.3rem; 
            margin-bottom: 4px; 
        }

        #mon-etagere.mode-liste .livre h3 { 
            font-size: 0.95rem; 
            margin-bottom: 4px;
        }

        #mon-etagere.mode-liste .livre-annee {
            margin-top: 2px;
            border-top: none;
            padding-top: 0;
        }

        #mon-etagere.mode-liste .actions { 
            display: flex; 
            flex-direction: column; 
            width: 150px; 
            border-left: 2px solid var(--gold); 
            border-top: none; 
            flex-shrink: 0;
        }

        #mon-etagere.mode-liste .btn-action { 
            flex: 1; 
            height: 100%; 
        }

        #mon-etagere.mode-liste .badge-statut { 
            top: 15px; 
            right: 165px; 
        }

        /* --- ÉTAT VIDE --- */
        .etat-vide {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(17, 14, 14, 0.7);
            border: 2px dashed var(--gold-muted);
        }

        .etat-vide h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .etat-vide p {
            font-style: italic;
            color: rgba(253, 253, 240, 0.7);
        }

        /* --- MODALES --- */
        .modal-overlay {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88); 
            display: none; 
            justify-content: center; 
            align-items: center;
            z-index: 3000; 
            backdrop-filter: blur(6px);
            padding: 20px;
        }

        .modal-content {
            background-image: 
                linear-gradient(rgba(253, 253, 240, 0.92), rgba(253, 253, 240, 0.92)),
                url('https://i.pinimg.com/736x/b5/b3/6c/b5b36cd3066c3e650885584abb88bc4e.jpg');
            background-size: cover; 
            background-position: center; 
            color: var(--carpet-black);
            width: 100%; 
            max-width: 820px; 
            min-height: 400px; 
            display: grid; 
            grid-template-columns: 260px 1fr; 
            border: 3px solid var(--gold); 
            outline: 1px solid var(--gold-muted);
            outline-offset: -7px;
            position: relative; 
            padding: 30px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .modal-img-wrap {
            width: 100%;
            height: 100%;
            background: #000;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .modal-details { 
            padding: 10px 25px 10px 35px; 
            overflow-y: auto; 
            height: 100%; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .modal-details h2 { 
            font-family: 'Lora', serif; 
            color: #1a0f11; 
            font-size: 1.8rem;
            margin: 0 0 8px 0; 
        }

        .modal-details h4 {
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            font-style: italic;
            color: var(--carpet-purple);
            margin: 0 0 15px 0;
        }

        .close-modal { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 2.2rem; 
            color: var(--carpet-red); 
            cursor: pointer; 
            z-index: 20; 
            line-height: 1; 
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        /* MODALE D'ÉDITION */
        .modal-edit-box {
            grid-template-columns: 1fr !important;
            max-width: 580px;
        }

        .modal-edit-box .modal-details {
            padding: 10px 20px;
        }

        .edit-form { 
            display: grid; 
            gap: 15px; 
        }

        .edit-form label { 
            font-family: 'Cinzel', serif; 
            color: var(--carpet-red); 
            font-size: 0.85rem; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
        }

        .edit-form input { 
            background: rgba(255, 255, 255, 0.85); 
            border: 1px solid var(--gold); 
            color: #110e0e; 
            width: 100%; 
            padding: 12px;
            font-size: 1rem;
        }
        
        .modal-actions { 
            display: flex; 
            gap: 12px; 
            margin-top: 15px; 
        }

        .btn-modal { 
            flex: 1; 
            padding: 13px; 
            border: none; 
            cursor: pointer; 
            font-family: 'Cinzel', serif; 
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s; 
        }

        .btn-save { 
            background: var(--pomegranate); 
            color: white; 
            border: 1px solid var(--gold); 
        }

        .btn-save:hover { 
            background: var(--danger); 
        }

        .btn-delete { 
            background: var(--danger); 
            color: white; 
        }

        .btn-delete:hover { 
            background: #7f0000; 
        }

        /* --- TOASTS --- */
        #toast-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-msg {
            background: rgba(17, 14, 14, 0.96);
            border: 2px solid var(--gold);
            color: var(--jasmine);
            padding: 13px 20px;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            pointer-events: auto;

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            #app-main { padding: 30px 15px 60px; }
            .header-container { padding: 30px 15px; }

</head>
<body>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Sanctuaire</h1>
            <input type="password" id="login-password" placeholder="Mot de passe" onkeypress="if(event.key === 'Enter') verifierMotDePasse()" autofocus>
            <button onclick="verifierMotDePasse()">Déverrouiller la Mktaba</button>
            <p id="login-error">L'accès vous est refusé.</p>
        </div>
    </div>

    <!-- APPLICATION PRINCIPALE -->
    <div id="app-main" style="display: none;">
        
        <!-- EN-TÊTE -->
        <div class="header-container">
            <h1>Mktaba</h1>
            
            <!-- Compteurs de la bibliothèque -->
            <div class="stats-bar">
                <div class="stat-box">
                    <span class="stat-num" id="stat-total">0</span>
                    <span class="stat-nom">Total</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="stat-lus" style="color: #66bb6a;">0</span>
                    <span class="stat-nom">Lus</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="stat-encours" style="color: #ffa726;">0</span>
                    <span class="stat-nom">En cours</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="stat-paslu" style="color: #bdbdbd;">0</span>
                    <span class="stat-nom">À lire</span>
                </div>
            </div>
        </div>

        <!-- CONSOLE DE GESTION -->
        <div class="container-gestion">
            
            <div class="controles-superieurs">
                <!-- Filtres Catégories -->
                <div class="filtres-categorie">
                    <button class="btn-filtre active" onclick="changerFiltreStatut('tous', this)">Tous</button>
                    <button class="btn-filtre" onclick="changerFiltreStatut('lu', this)">Lus</button>
                    <button class="btn-filtre" onclick="changerFiltreStatut('en cours', this)">En cours</button>
                    <button class="btn-filtre" onclick="changerFiltreStatut('pas lu', this)">À lire</button>
                </div>
                
                <div class="controles-droite">
                    <!-- Filtre Année -->
                    <select id="select-annee" onchange="changerFiltreAnnee()">
                        <option value="toutes">Toutes les années</option>
                    </select>

                    <!-- Toggle Vue Grille / Liste -->
                    <div class="controles-vue">
                        <button class="btn-filtre active" id="btn-vue-grille" onclick="changerVue('grille')">⊞ Grille</button>
                        <button class="btn-filtre" id="btn-vue-liste" onclick="changerVue('liste')">☰ Liste</button>
                    </div>
                </div>
            </div>

            <!-- Barre de Recherche -->
            <div class="borne-recherche">
                <input type="text" id="input-recherche" placeholder="Rechercher un titre ou un auteur...">
            </div>

            <!-- Formulaire d'Ajout de Livre -->
            <form id="formulaire-livre">
                <input type="text" id="Titre" placeholder="Titre" required>
                <input type="text" id="Auteur" placeholder="Auteur" required>
                <input type="url" id="Image" placeholder="Lien image URL">
                <input type="number" id="Annee" min="1900" max="2099" step="1" placeholder="Année de lecture">
                <button type="submit">Ajouter à la base de données</button>
            </form>

            <!-- Zone d'Import / Export -->
            <div class="zone-archives">
                <div class="zone-archives-btns">
                    <button type="button" class="btn-archive" onclick="document.getElementById('import-txt-mktaba').click()" style="background: rgba(245, 127, 23, 0.45);">
                        📤 Transférer ma sauvegarde (Import TXT vers Firebase)
                    </button>
                    <button type="button" class="btn-archive" onclick="exporterSauvegardeCloud()" style="background: rgba(46, 125, 50, 0.45);">
                        📥 Sauvegarder ma bibliothèque (Export TXT)
                    </button>
                    <button type="button" class="btn-archive" onclick="document.getElementById('import-csv').click()" style="background: rgba(93, 64, 55, 0.6);">
                        📜 Importer depuis Goodreads (CSV)
                    </button>
                </div>
                <input type="file" id="import-txt-mktaba" accept=".txt" style="display: none;" onchange="importerDonneesFirebase(event)">
                <input type="file" id="import-csv" accept=".csv" style="display: none;" onchange="importerGoodreadsCSV(event)">
            </div>

        </div>

        <!-- ÉTAGÈRE DES LIVRES -->
        <div id="mon-etagere"></div>

    </div>

    <!-- MODALE : DÉTAILS DU LIVRE -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-modal" onclick="fermerModales()">&times;</span>
            <div class="modal-img-wrap">
                <img src="" alt="Couverture" class="modal-img" id="modalImg">
            </div>
            <div class="modal-details">
                <div>
                    <h2 id="modalTitre">Titre</h2>
                    <h4 id="modalAuteur">Auteur</h4>
                    <p id="modalAnnee" class="livre-annee" style="font-size: 1rem; border-top: none; padding-top: 0;"></p>
                </div>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="btn-modal btn-save" onclick="ouvrirEditionDepuisDetails()">Modifier</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE : MODIFIER L'OUVRAGE -->
    <div class="modal-overlay" id="modalEditOverlay">
        <div class="modal-content modal-edit-box">
            <span class="close-modal" onclick="fermerModales()">&times;</span>
            <div class="modal-details">
                <h2 style="font-family: 'Cinzel Decorative', cursive; color: var(--carpet-red); text-shadow: none; text-align: center; margin-bottom: 20px;">Modifier l'Ouvrage</h2>
                <div class="edit-form">
                    <input type="hidden" id="editId">
                    <div>
                        <label>Titre de l'Œuvre</label>
                        <input type="text" id="editTitre" required>
                    </div>
                    <div>
                        <label>Auteur</label>
                        <input type="text" id="editAuteur" required>
                    </div>
                    <div>
                        <label>Lien de l'image</label>
                        <input type="text" id="editImg">
                    </div>
                    <div>
                        <label>Année de lecture</label>
                        <input type="number" id="editAnnee" min="1900" max="2099" step="1" placeholder="Ex: 2026">
                    </div>
                    <div class="modal-actions">
                        <button class="btn-modal btn-save" onclick="appliquerModifications()">Sauvegarder</button>
                        <button class="btn-modal btn-delete" onclick="supprimerLivre()">Supprimer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEUR NOTIFICATIONS TOAST -->
    <div id="toast-container"></div>

    <script>
        // --- INITIALISATION DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHy_LCpulCpA_cZ80iW-yXUZXHA8ATfR4",
            authDomain: "mktaba-6db08.firebaseapp.com",
            projectId: "mktaba-6db08",
            storageBucket: "mktaba-6db08.firebasestorage.app",
            messagingSenderId: "716876934266",
            appId: "1:716876934266:web:9d67feea200543ec02dfc3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- SYSTÈME DE CONNEXION ---
        const MOT_DE_PASSE_SECRET = "mktaba123";

        function verifierMotDePasse() {
            const input = document.getElementById("login-password").value;
            if (input === MOT_DE_PASSE_SECRET) {
                sessionStorage.setItem("mktaba-authentifie", "oui");
                deverrouillerApp();
            } else {
                const err = document.getElementById("login-error");
                err.style.display = "block";
                setTimeout(() => { err.style.display = "none"; }, 3500);
            }
        }

        function deverrouillerApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-main").style.display = "block";
            initialiserEcouteurFirebase();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("mktaba-authentifie") === "oui") {
                deverrouillerApp();
            }
            if (localStorage.getItem("vue-mktaba") === "liste") {
                changerVue('liste');
            }
        });

        // --- VARIABLES GLOBALES ---
        let bibliotheque = [];
        let livreEnCoursDetailsId = null;
        let filtreActuelStatut = 'tous';
        let filtreActuelAnnee = 'toutes';
        const etagere = document.getElementById("mon-etagere");

        // --- NOTIFICATIONS TOAST ---
        function notifier(message) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "toast-msg";
            toast.innerText = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- ÉCOUTEUR EN TEMPS RÉEL SUR FIREBASE ---
        function initialiserEcouteurFirebase() {
            db.collection("livres").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                bibliotheque = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    bibliotheque.push({
                        id: doc.id,
                        titre: data.titre || "",
                        auteur: data.auteur || "",
                        image: data.image || "",
                        annee: data.annee || "",
                        statut: data.statut || "pas lu"
                    });
                });
                mettreAJourStats();
                afficherLivres();
            }, (error) => {
                notifier("Erreur Firebase : " + error.message);
            });
        }

        function getCouleurStatut(statut) {
            if (statut === "lu") return "var(--statut-lu)";
            if (statut === "en cours") return "var(--statut-encours)";
            return "var(--statut-paslu)";
        }

        function mettreAJourStats() {
            document.getElementById("stat-total").innerText = bibliotheque.length;
            document.getElementById("stat-lus").innerText = bibliotheque.filter(l => l.statut === "lu").length;
            document.getElementById("stat-encours").innerText = bibliotheque.filter(l => l.statut === "en cours").length;
            document.getElementById("stat-paslu").innerText = bibliotheque.filter(l => l.statut === "pas lu").length;
        }

        // --- AFFICHAGE DES LIVRES ---
        function afficherLivres() {
            const saisie = document.getElementById("input-recherche").value.trim().toLowerCase();
            
            const selectAnnee = document.getElementById("select-annee");
            const anneesDispos = [...new Set(bibliotheque.map(l => l.annee).filter(a => a !== "" && a !== undefined))].sort((a,b) => b - a);
            
            let optionsHTML = '<option value="toutes">Toutes les années</option>';
            anneesDispos.forEach(a => {
                optionsHTML += `<option value="${a}">${a}</option>`;
            });
            selectAnnee.innerHTML = optionsHTML;
            selectAnnee.value = anneesDispos.includes(filtreActuelAnnee) ? filtreActuelAnnee : 'toutes';

            const livresFiltres = bibliotheque.filter(livre => {
                const matchTexte = livre.titre.toLowerCase().includes(saisie) || 
                                   livre.auteur.toLowerCase().includes(saisie) ||
                                   (livre.annee && livre.annee.toString().includes(saisie));
                const matchStatut = (filtreActuelStatut === 'tous' || livre.statut === filtreActuelStatut);
                const matchAnnee = (filtreActuelAnnee === 'toutes' || livre.annee == filtreActuelAnnee);
                return matchTexte && matchStatut && matchAnnee;
            });

            if (livresFiltres.length === 0) {
                etagere.innerHTML = `
                    <div class="etat-vide">
                        <h3>Aucun livre trouvé</h3>
                        <p>${bibliotheque.length === 0 ? "Votre bibliothèque est vide. Ajoutez un livre ci-dessus." : "Aucun livre ne correspond à votre recherche."}</p>
                    </div>
                `;
                return;
            }

            etagere.innerHTML = livresFiltres.map(livre => `
                <div class="livre" data-id="${livre.id}">
                    <div class="badge-statut" style="background:${getCouleurStatut(livre.statut)}" onclick="changerStatutLivre('${livre.id}', event)">
                        ${livre.statut}
                    </div>
                    <div class="livre-cover-container" onclick="ouvrirDetails('${livre.id}')">
                        <img src="${livre.image || 'https://via.placeholder.com/400x600/110e0e/d4af37?text=Couverture'}" 
                             loading="lazy" 
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/400x600/110e0e/d4af37?text=Couverture'" 
                             alt="${livre.titre}">
                    </div>
                    <div class="livre-info" onclick="ouvrirDetails('${livre.id}')">
                        <div>
                            <h2>${livre.titre}</h2>
                            <h3>${livre.auteur}</h3>
                        </div>
                        ${livre.annee ? `<p class="livre-annee">Lu en : ${livre.annee}</p>` : ''}
                    </div>
                    <div class="actions">
                        <button type="button" class="btn-action bouton-modifier" onclick="abrirEdition('${livre.id}')">Modifier</button>
                    </div>
                </div>
            `).join('');
        }

        // --- AJOUTER UN LIVRE DANS FIREBASE ---
        document.getElementById("formulaire-livre").onsubmit = (e) => {
            e.preventDefault();
            const titre = document.getElementById("Titre").value.trim();
            const auteur = document.getElementById("Auteur").value.trim();
            const image = document.getElementById("Image").value.trim() || "";
            const annee = document.getElementById("Annee").value.trim();

            db.collection("livres").add({
                titre: titre,
                auteur: auteur,
                image: image,
                annee: annee,
                statut: "pas lu",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                e.target.reset();
                notifier(`« ${titre} » a été ajouté à la base de données.`);
            }).catch(error => {
                alert("Erreur : " + error.message);
            });
        };

        // --- CHANGER LE STATUT RAPIDEMENT DANS FIREBASE ---
        function changerStatutLivre(id, event) {
            if (event) event.stopPropagation(); 
            const livre = bibliotheque.find(l => l.id === id);
            if (!livre) return;

            let nouveauStatut = "pas lu";
            if (livre.statut === "pas lu") nouveauStatut = "en cours";
            else if (livre.statut === "en cours") nouveauStatut = "lu";

            db.collection("livres").doc(id).update({ statut: nouveauStatut });
        }

        // --- MODALE DÉTAILS ---
        function ouvrirDetails(id) {
            const livre = bibliotheque.find(l => l.id === id);
            if (!livre) return;
            livreEnCoursDetailsId = id;

            document.getElementById("modalTitre").innerText = livre.titre;
            document.getElementById("modalAuteur").innerText = livre.auteur;
            document.getElementById("modalImg").src = livre.image || 'https://via.placeholder.com/400x600/110e0e/d4af37?text=Couverture';
            document.getElementById("modalAnnee").innerText = livre.annee ? `Lu en : ${livre.annee}` : '';
            document.getElementById("modalOverlay").style.display = "flex";
        }

        function ouvrirEditionDepuisDetails() {
            fermerModales();
            if (livreEnCoursDetailsId) {
                abrirEdition(livreEnCoursDetailsId);
            }
        }

        // --- MODALE ÉDITION ---
        function abrirEdition(id) {
            const livre = bibliotheque.find(l => l.id === id);
            if (!livre) return;

            document.getElementById("editId").value = livre.id;
            document.getElementById("editTitre").value = livre.titre;
            document.getElementById("editAuteur").value = livre.auteur;
            document.getElementById("editImg").value = livre.image;
            document.getElementById("editAnnee").value = livre.annee || "";
            document.getElementById("modalEditOverlay").style.display = "flex";
        } 

        // --- APPLIQUER MODIFICATIONS ---
        function appliquerModifications() {
            const id = document.getElementById("editId").value;
            db.collection("livres").doc(id).update({
                titre: document.getElementById("editTitre").value.trim(),
                auteur: document.getElementById("editAuteur").value.trim(),
                image: document.getElementById("editImg").value.trim(),
                annee: document.getElementById("editAnnee").value.trim()
            }).then(() => {
                fermerModales();
                notifier("Modifications enregistrées.");
            }).catch(error => {
                alert("Erreur : " + error.message);
            });
        }

        // --- SUPPRIMER UN LIVRE ---
        function supprimerLivre() {
            const id = document.getElementById("editId").value;
            if (confirm("Voulez-vous vraiment retirer cet ouvrage de votre collection cloud ?")) {
                db.collection("livres").doc(id).delete().then(() => {
                    fermerModales();
                    notifier("Ouvrage supprimé.");
                }).catch(err => alert("Erreur : " + err.message));
            }
        }

        // --- GESTION DE LA VUE ---
        function changerVue(mode) {
            const btnGrille = document.getElementById("btn-vue-grille");
            const btnListe = document.getElementById("btn-vue-liste");
            
            if (mode === 'liste') {
                etagere.classList.add("mode-liste");
                btnListe.classList.add("active");
                btnGrille.classList.remove("active");
                localStorage.setItem("vue-mktaba", "liste");
            } else {
                etagere.classList.remove("mode-liste");
                btnGrille.classList.add("active");
                btnListe.classList.remove("active");
                localStorage.setItem("vue-mktaba", "grille");
            }
        }

        function changerFiltreStatut(statut, btn) {
            document.querySelectorAll('.filtres-categorie .btn-filtre').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtreActuelStatut = statut;
            afficherLivres();
        }

        function changerFiltreAnnee() {
            filtreActuelAnnee = document.getElementById("select-annee").value;
            afficherLivres();
        }

        function fermerModales() {
            document.getElementById("modalOverlay").style.display = "none";
            document.getElementById("modalEditOverlay").style.display = "none";
        }

        window.onclick = (e) => { 
            if (e.target.classList.contains('modal-overlay')) fermerModales(); 
        };

        document.getElementById("input-recherche").addEventListener('input', afficherLivres);

        // --- EXPORT DE SAUVEGARDE EN FICHIER TXT ---
        function exporterSauvegardeCloud() {
            if (bibliotheque.length === 0) {
                alert("Aucun livre à exporter.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bibliotheque, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mktaba_sauvegarde_${dateStr}.txt`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // --- IMPORT MASSIF DU FICHIER TXT DIRECTEMENT VERS FIREBASE ---
        function importerDonneesFirebase(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const donneesImportees = JSON.parse(e.target.result);
                    if (Array.isArray(donneesImportees)) {
                        if (confirm(`Êtes-vous sûr de vouloir transférer ces ${donneesImportees.length} livres dans votre base de données Cloud ?`)) {
                            
                            const batch = db.batch();
                            donneesImportees.forEach(livre => {
                                const newDocRef = db.collection("livres").doc();
                                batch.set(newDocRef, {
                                    titre: livre.titre || "Sans titre",
                                    auteur: livre.auteur || "Auteur inconnu",
                                    image: livre.image || "",
                                    annee: livre.annee || "",
                                    statut: livre.statut || "pas lu",
                                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            });
                            
                            batch.commit().then(() => {
                                alert("☁️ Migration réussie ! Vos livres sont synchronisés dans Firebase.");
                            }).catch(err => {
                                alert("Erreur de synchronisation avec le cloud : " + err);
                            });
                        }
                    } else {
                        alert("Le format du fichier n'est pas valide.");
                    }
                } catch (err) {
                    alert("Erreur de lecture du fichier texte.");
                }
            };
            reader.readAsText(file);
        }

        // --- IMPORT GOODREADS CSV ---
        function importerGoodreadsCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const lignes = e.target.result.split(/\r?\n/);
                const batch = db.batch();
                let compte = 0;

                for (let i = 1; i < lignes.length; i++) {
                    if (!lignes[i].trim()) continue; 
                    const cols = lignes[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || []; 
                    if (cols.length < 5) continue;

                    const nettoyage = (str) => str ? str.replace(/^"|"$/g, '').trim() : '';

                    const tit = nettoyage(cols[1]);
                    const aut = nettoyage(cols[2]);
                    const isbn = nettoyage(cols[5] || cols[6]).replace(/[^0-9X]/gi, "");
                    const grStatut = nettoyage(cols[18] || cols[13]) || "to-read"; 
                    
                    const dateRead = nettoyage(cols[14]);
                    const anneeImport = dateRead ? dateRead.split(/[\/-]/)[0] : "";

                    let finalStatut = "pas lu";
                    if (grStatut === "read") finalStatut = "lu";
                    else if (grStatut === "currently-reading") finalStatut = "en cours";

                    const img = isbn.length >= 10 
                        ? `https://books.google.com/books/content?vid=isbn${isbn}&printsec=frontcover&img=1&zoom=2` 
                        : "";

                    const newDocRef = db.collection("livres").doc();
                    batch.set(newDocRef, {
                        titre: tit,
                        auteur: aut,
                        image: img,
                        annee: anneeImport,
                        statut: finalStatut,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    compte++;
                }

                if (compte > 0 && confirm(`Importer ces ${compte} livres Goodreads vers Firebase ?`)) {
                    batch.commit().then(() => {
                        alert(`${compte} livres Goodreads ont été ajoutés à votre base de données !`);
                    }).catch(err => {
                        alert("Erreur d'import : " + err);
                    });
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
